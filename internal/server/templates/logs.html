<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логи синхронизации - Yandex Tracker Better Search</title>
    <script src="/static/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/logs.css">
</head>

<body>
    <header>
        <a href="/" class="logo">🔍 Yandex Tracker Better Search</a>
        <a href="/" class="btn">← Назад к поиску</a>
    </header>

    <main>
        <h1>📋 Логи синхронизации</h1>

        <div class="logs-container" hx-get="/logs" hx-trigger="every 5s" hx-select=".logs-container"
            hx-swap="outerHTML">
            {{if .Logs}}
            {{range .Logs}}
            <div class="log-entry">
                <span class="log-time">{{formatTime .Time}}</span>
                <span class="log-level {{.Level}}">{{.Level}}</span>
                <span class="log-message">{{.Message}}</span>
            </div>
            {{end}}
            {{else}}
            <div class="empty-logs">
                Логов пока нет
            </div>
            {{end}}
        </div>

        <div class="auto-refresh">
            Автообновление каждые 5 секунд
        </div>
    </main>
</body>

</html>
