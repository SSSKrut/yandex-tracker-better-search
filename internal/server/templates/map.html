<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Map</title>
    <link rel="stylesheet" href="/static/map.css">
</head>

<body>
    <header>
        <a href="/" class="logo">🗺️ Tracker Map</a>
        <div class="header-right">
            <a href="/" class="btn">🔍 Поиск</a>
            <a href="/logs" class="btn">📋 Логи</a>
        </div>
    </header>

    <main>
        <div class="map-layout">
            <div class="panel">
                <div>
                    <h2>Карта схожести</h2>
                    <div class="stats" id="stats">Загрузка...</div>
                </div>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Найти по ключу или названию">
                </div>
                <div>
                    <h2>Выбранный элемент</h2>
                    <div class="selected-card" id="selected-card">Нажмите на точку на карте</div>
                </div>
                <div>
                    <h2>Похожие элементы</h2>
                    <div class="neighbors" id="neighbors">-</div>
                </div>
                <div>
                    <h2>Легенда</h2>
                    <div class="legend" id="legend"></div>
                </div>
            </div>
            <div class="map-card">
                <canvas id="map-canvas"></canvas>
                <div class="loading" id="map-loading">Строим карту...</div>
            </div>
        </div>
    </main>

    <script src="/static/map.js" defer></script>
</body>

</html>
