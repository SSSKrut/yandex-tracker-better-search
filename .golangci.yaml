version: "2"

run:
  timeout: 5m

issues:
  # By default the report is capped at 3 identical findings; the rest vanish.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - noctx
    - unconvert
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
