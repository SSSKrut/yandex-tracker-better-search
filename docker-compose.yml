services:
  manticore:
    image: manticoresearch/manticore:latest
    environment:
      - EXTRA=1
    ports:
      # - 9306:9306  # MySQL protocol
      - 9308:9308  # HTTP API
    volumes:
      - manticore_data:/var/lib/manticore
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "--post-data=query=SHOW TABLES", "http://127.0.0.1:9308/sql?mode=raw"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  ytbs:
    build: .
    depends_on:
      manticore:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MANTICORE_URL=http://manticore:9308
      - SYNC_STATE_PATH=/app/backups/sync_state.json
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
    volumes:
      - ./backups:/app/backups

volumes:
  manticore_data:
