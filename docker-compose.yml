services:
  manticore:
    image: manticoresearch/manticore:latest
    environment:
      - EXTRA=1
    ports:
      # - 9306:9306  # MySQL protocol
      - 9308:9308  # HTTP API
    volumes:
      - manticore_data:/var/lib/manticore

  ytbs:
    build: .
    depends_on:
      - manticore
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MANTICORE_URL=http://manticore:9308
      - SYNC_STATE_PATH=/app/backups/sync_state.json
    volumes:
      - ./backups:/app/backups

volumes:
  manticore_data:
